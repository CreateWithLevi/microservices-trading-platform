---
# Service D: Template/Placeholder Service
# NOTE: This service does not exist in the codebase yet.
# Update this manifest when the service is implemented.
---
apiVersion: v1
kind: Service
metadata:
  name: service-d
  namespace: trading-system
  labels:
    app: service-d
    component: placeholder
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: service-d

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-d
  namespace: trading-system
  labels:
    app: service-d
    component: placeholder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-d
  template:
    metadata:
      labels:
        app: service-d
        component: placeholder
    spec:
      containers:
        - name: service-d
          image: service-d:latest  # Update with actual image
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: trading-platform-config
                  key: NODE_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: trading-platform-config
                  key: LOG_LEVEL
            # Add additional environment variables as needed
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
