---
# Service A: Signal Generator (Producer)
# Generates trading signals and publishes to RabbitMQ
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: trading-system
  labels:
    app: service-a
    component: signal-generator
spec:
  replicas: 1  # Single instance (not horizontally scalable)
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
        component: signal-generator
    spec:
      containers:
        - name: service-a
          image: service-a:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: trading-platform-config
                  key: RABBITMQ_URL
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: trading-platform-config
                  key: NODE_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: trading-platform-config
                  key: LOG_LEVEL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps aux | grep -v grep | grep node || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps aux | grep -v grep | grep node || exit 1"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
