---
# Ingress Controller Resource
# Routes external traffic to internal services
# Requires NGINX Ingress Controller to be installed
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-platform-ingress
  namespace: trading-system
  labels:
    app: trading-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Rate limiting (optional)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    # CORS settings (optional)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  ingressClassName: nginx
  rules:
    # Route for Frontend Web UI
    - host: trading.local
      http:
        paths:
          # Frontend routes
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

          # API Gateway routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

          # RabbitMQ Management UI (optional - for debugging)
          - path: /rabbitmq
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  number: 15672

---
# Optional: Ingress for gRPC services (if exposing externally)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-platform-grpc-ingress
  namespace: trading-system
  labels:
    app: trading-platform
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: grpc.trading.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-c
                port:
                  number: 50051
