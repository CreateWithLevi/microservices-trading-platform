---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-platform-config
  namespace: trading-system
  labels:
    app: trading-platform
data:
  # RabbitMQ Configuration
  RABBITMQ_URL: "amqp://rabbitmq.trading-system.svc.cluster.local:5672"
  RABBITMQ_MGMT_PORT: "15672"

  # Redis Configuration
  REDIS_URL: "redis://redis.trading-system.svc.cluster.local:6379"

  # Risk Service (gRPC) Configuration
  RISK_SERVICE_URL: "service-c.trading-system.svc.cluster.local:50051"
  GRPC_PORT: "50051"

  # TimescaleDB Configuration
  TIMESCALEDB_HOST: "timescaledb.trading-system.svc.cluster.local"
  TIMESCALEDB_PORT: "5432"
  TIMESCALEDB_DATABASE: "trading_data"

  # MongoDB Configuration
  MONGODB_HOST: "mongodb.trading-system.svc.cluster.local"
  MONGODB_PORT: "27017"
  MONGODB_DATABASE: "trading_platform"

  # ChromaDB Configuration
  CHROMADB_HOST: "chromadb.trading-system.svc.cluster.local"
  CHROMADB_PORT: "8000"

  # Application Configuration
  NODE_ENV: "production"
  LOG_LEVEL: "info"
