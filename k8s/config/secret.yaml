---
apiVersion: v1
kind: Secret
metadata:
  name: trading-platform-secret
  namespace: trading-system
  labels:
    app: trading-platform
type: Opaque
stringData:
  # RabbitMQ Credentials
  RABBITMQ_USER: "admin"
  RABBITMQ_PASSWORD: "changeme123"

  # Redis Password (optional - empty by default)
  REDIS_PASSWORD: ""

  # TimescaleDB Credentials
  TIMESCALEDB_USER: "postgres"
  TIMESCALEDB_PASSWORD: "changeme123"

  # MongoDB Credentials
  MONGODB_USER: "admin"
  MONGODB_PASSWORD: "changeme123"
  MONGODB_ROOT_PASSWORD: "rootchangeme123"

  # API Keys and Secrets (examples)
  API_SECRET_KEY: "your-secret-key-here"
  JWT_SECRET: "your-jwt-secret-here"
