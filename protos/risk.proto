syntax = "proto3";
package risk;
option go_package = "./riskpb";

service RiskChecker {
  rpc CheckTradeRisk (TradeRiskRequest) returns (TradeRiskResponse) {}
}

message TradeRiskRequest {
  string assetId = 1;
  double volume = 2;
  string action = 3;
  string timestamp = 4;
}

message TradeRiskResponse {
  bool allowed = 1;
  string reason = 2;
  string checkId = 3;
}
