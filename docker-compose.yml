version: '3.8'

services:
  # Service 1: RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # Service port
      - "15672:15672" # Management UI
    networks:
      - trading_network

  # ----------------------------------------------------

  # Service 2: Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - trading_network
    command: redis-server --appendonly yes

  # ----------------------------------------------------

  # Service 3: MongoDB Database
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    networks:
      - trading_network
    environment:
      - MONGO_INITDB_DATABASE=audit_logs
    volumes:
      - mongo_data:/data/db

  # ----------------------------------------------------

  # Service 4: Mongo Express (MongoDB Web UI)
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8081:8081"
    networks:
      - trading_network
    depends_on:
      - mongo
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin

  # ----------------------------------------------------

  # Service 5: AI Signal Generator (Service A)
  service-a:
    build:
      context: ./service-a           # Dockerfile context path (service-a)
      dockerfile: ../Dockerfile.node # Our shared Dockerfile
    container_name: service-a
    # 'depends_on' ensures rabbitmq starts before service A
    depends_on:
      - rabbitmq
    networks:
      - trading_network
    # (IMPORTANT) Override 'localhost' in code
    environment:
      - RABBITMQ_URL=amqp://rabbitmq

  # ----------------------------------------------------

  # Service 6: Trade Execution Service (Service B)
  service-b:
    build:
      context: ./service-b           # Dockerfile context path (service-b)
      dockerfile: ../Dockerfile.node # Our shared Dockerfile
    # No container_name to allow scaling
    depends_on:
      - rabbitmq
      - redis
      - service-c
    networks:
      - trading_network
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - REDIS_URL=redis://redis:6379
      - RISK_SERVICE_URL=service-c:50051

  # ----------------------------------------------------

  # Service 7: Risk Checker gRPC Service (Service C)
  service-c:
    build:
      context: ./service-c           # Dockerfile context path (service-c)
      dockerfile: ./Dockerfile       # Go-specific Dockerfile
    container_name: service-c
    ports:
      - "50051:50051"                # Expose gRPC port
    networks:
      - trading_network
    environment:
      - GRPC_PORT=50051

  # ----------------------------------------------------

  # Service 8: Audit Service (Service E)
  service-e:
    build:
      context: ./service-e           # Dockerfile context path (service-e)
      dockerfile: ../Dockerfile.node # Our shared Dockerfile
    container_name: service-e
    depends_on:
      - rabbitmq
      - mongo
    networks:
      - trading_network
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - MONGODB_URL=mongodb://mongo:27017/audit_logs

# ------------------------------------------------------

# Virtual network for Docker services to communicate
networks:
  trading_network:
    driver: bridge

# Persistent volumes for data storage
volumes:
  mongo_data:
    driver: local
