version: '3.8'

services:
  # Service 1: RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # Service port
      - "15672:15672" # Management UI
    networks:
      - trading_network

  # ----------------------------------------------------

  # Service 2: Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - trading_network
    command: redis-server --appendonly yes

  # ----------------------------------------------------

  # Service 3: AI Signal Generator (Service A)
  service-a:
    build:
      context: ./service-a           # Dockerfile context path (service-a)
      dockerfile: ../Dockerfile.node # Our shared Dockerfile
    container_name: service-a
    # 'depends_on' ensures rabbitmq starts before service A
    depends_on:
      - rabbitmq
    networks:
      - trading_network
    # (IMPORTANT) Override 'localhost' in code
    environment:
      - RABBITMQ_URL=amqp://rabbitmq

  # ----------------------------------------------------

  # Service 4: Trade Execution Service (Service B)
  service-b:
    build:
      context: ./service-b           # Dockerfile context path (service-b)
      dockerfile: ../Dockerfile.node # Our shared Dockerfile
    # No container_name to allow scaling
    depends_on:
      - rabbitmq
      - redis
      - service-c
    networks:
      - trading_network
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - REDIS_URL=redis://redis:6379
      - RISK_SERVICE_URL=service-c:50051

  # ----------------------------------------------------

  # Service 5: Risk Checker gRPC Service (Service C)
  service-c:
    build:
      context: ./service-c           # Dockerfile context path (service-c)
      dockerfile: ./Dockerfile       # Go-specific Dockerfile
    container_name: service-c
    ports:
      - "50051:50051"                # Expose gRPC port
    networks:
      - trading_network
    environment:
      - GRPC_PORT=50051

  # ----------------------------------------------------

  # Service 6: ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"                  # Expose ChromaDB API port
    networks:
      - trading_network
    volumes:
      - chroma_data:/chroma/chroma   # Persist vector database
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ----------------------------------------------------

  # Service 7: AI Agent Service (Service D)
  service-d:
    build:
      context: ./service-d           # Dockerfile context path (service-d)
      dockerfile: ./Dockerfile       # Python FastAPI Dockerfile
    container_name: service-d
    depends_on:
      chromadb:
        condition: service_healthy   # Wait for ChromaDB to be ready
    ports:
      - "8001:8001"                  # Expose FastAPI port
    networks:
      - trading_network
    environment:
      - PORT=8001
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 3s
      start_period: 15s              # Increased for model loading
      retries: 3

# ------------------------------------------------------

# Virtual network for Docker services to communicate
networks:
  trading_network:
    driver: bridge

# Volumes for data persistence
volumes:
  chroma_data:
    driver: local
