version: '3.8'

services:
  # Service 1: RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # Service port
      - "15672:15672" # Management UI
    networks:
      - trading_network

  # ----------------------------------------------------

  # Service 2: Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - trading_network
    command: redis-server --appendonly yes

  # ----------------------------------------------------

  # Service 3: TimescaleDB for long-term trade storage
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    ports:
      - "5432:5432"
    networks:
      - trading_network
    environment:
      - POSTGRES_DB=trading_platform
      - POSTGRES_USER=trading_user
      - POSTGRES_PASSWORD=trading_pass
    volumes:
      - ./timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql
      - timescale_data:/var/lib/postgresql/data

  # ----------------------------------------------------

  # Service 4: AI Signal Generator (Service A)
  service-a:
    build:
      context: ./service-a           # Dockerfile context path (service-a)
      dockerfile: ../Dockerfile.node # Our shared Dockerfile
    container_name: service-a
    # 'depends_on' ensures rabbitmq starts before service A
    depends_on:
      - rabbitmq
    networks:
      - trading_network
    # (IMPORTANT) Override 'localhost' in code
    environment:
      - RABBITMQ_URL=amqp://rabbitmq

  # ----------------------------------------------------

  # Service 5: Trade Execution Service (Service B)
  service-b:
    build:
      context: ./service-b           # Dockerfile context path (service-b)
      dockerfile: ../Dockerfile.node # Our shared Dockerfile
    # No container_name to allow scaling
    depends_on:
      - rabbitmq
      - redis
      - service-c
      - timescaledb
    networks:
      - trading_network
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - REDIS_URL=redis://redis:6379
      - RISK_SERVICE_URL=service-c:50051
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - TIMESCALE_DATABASE=trading_platform
      - TIMESCALE_USER=trading_user
      - TIMESCALE_PASSWORD=trading_pass

  # ----------------------------------------------------

  # Service 6: Risk Checker gRPC Service (Service C)
  service-c:
    build:
      context: ./service-c           # Dockerfile context path (service-c)
      dockerfile: ./Dockerfile       # Go-specific Dockerfile
    container_name: service-c
    ports:
      - "50051:50051"                # Expose gRPC port
    networks:
      - trading_network
    environment:
      - GRPC_PORT=50051

# ------------------------------------------------------

# Virtual network for Docker services to communicate
networks:
  trading_network:
    driver: bridge

# Persistent volumes for data storage
volumes:
  timescale_data:
    driver: local
