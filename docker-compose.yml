version: '3.8'

services:
  # Service 1: RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # Service port
      - "15672:15672" # Management UI
    networks:
      - trading_network

  # ----------------------------------------------------

  # Service 2: Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - trading_network
    command: redis-server --appendonly yes

  # ----------------------------------------------------

  # Service 3: AI Signal Generator (Service A)
  service-a:
    build:
      context: ./service-a           # Dockerfile context path (service-a)
      dockerfile: ../Dockerfile.node # Our shared Dockerfile
    container_name: service-a
    # 'depends_on' ensures rabbitmq starts before service A
    depends_on:
      - rabbitmq
    networks:
      - trading_network
    # (IMPORTANT) Override 'localhost' in code
    environment:
      - RABBITMQ_URL=amqp://rabbitmq

  # ----------------------------------------------------

  # Service 4: Trade Execution Service (Service B)
  service-b:
    build:
      context: ./service-b           # Dockerfile context path (service-b)
      dockerfile: ../Dockerfile.node # Our shared Dockerfile
    # No container_name to allow scaling
    depends_on:
      - rabbitmq
      - redis
      - service-c
    networks:
      - trading_network
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - REDIS_URL=redis://redis:6379
      - RISK_SERVICE_URL=service-c:50051

  # ----------------------------------------------------

  # Service 5: Risk Checker gRPC Service (Service C)
  service-c:
    build:
      context: ./service-c           # Dockerfile context path (service-c)
      dockerfile: ./Dockerfile       # Go-specific Dockerfile
    container_name: service-c
    ports:
      - "50051:50051"                # Expose gRPC port
    networks:
      - trading_network
    environment:
      - GRPC_PORT=50051

  # ----------------------------------------------------

  # Service 6: Kong API Gateway (DB-less mode)
  # BFF (Backend for Frontend) pattern - routes traffic to internal services
  kong:
    image: kong:3.5-alpine
    container_name: kong-gateway
    environment:
      # DB-less mode configuration
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yml
      # Proxy configuration
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      # Listen addresses
      - KONG_PROXY_LISTEN=0.0.0.0:8000
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
    ports:
      - "8000:8000"  # Proxy port (main API gateway endpoint)
      - "8001:8001"  # Admin API port
    volumes:
      # Mount declarative configuration
      - ./infra/kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    networks:
      - trading_network
    depends_on:
      - service-a
      - service-c
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

# ------------------------------------------------------

# Virtual network for Docker services to communicate
networks:
  trading_network:
    driver: bridge
